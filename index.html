<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuê Xe Tự Lái</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <style>
        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; }
        .fab-icon img { width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.3s ease; }
        .fab-icon img:hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- HỘP THOẠI NHẬP THÔNG TIN KHÁCH HÀNG -->
    <div id="booking-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md shadow-2xl">
            <h3 class="font-bold text-xl mb-4 text-blue-800">Thông tin đặt xe</h3>
            <p id="modal-car-name" class="text-gray-600 mb-4 font-semibold"></p>
            
            <input type="text" id="customerName" placeholder="Tên khách hàng (*)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="tel" id="customerPhone" placeholder="Số điện thoại (*)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="text" id="deliveryAddress" placeholder="Địa chỉ giao xe (Có thể báo sau)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="text" id="returnAddress" placeholder="Địa chỉ trả xe (Có thể báo sau)" class="w-full border p-2 mb-4 rounded focus:ring-2 focus:ring-blue-400">
            
            <div class="flex justify-end gap-2">
                <button onclick="window.closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded font-bold hover:bg-gray-500">Hủy</button>
                <button id="btn-submit" onclick="window.submitBooking()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">Xác nhận Đặt</button>
            </div>
        </div>
    </div>

    <!-- TIÊU ĐỀ -->
    <header class="bg-blue-600 text-white text-center p-6 shadow-md">
        <h1 class="text-3xl font-bold">Thuê Xe Tự Lái - Nhanh Chóng & Chuyên Nghiệp</h1>
        <p class="mt-2 text-blue-100">Chọn thời gian để kiểm tra xe trống và nhận báo giá</p>
    </header>

    <!-- BỘ LỌC THỜI GIAN -->
    <div class="max-w-4xl mx-auto mt-6 bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 font-bold mb-1">Thời gian nhận xe</label>
                <input type="text" id="startTime" class="w-full border rounded p-2 bg-white focus:ring-2 focus:ring-blue-400" placeholder="Chọn ngày giờ...">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">Thời gian trả xe</label>
                <input type="text" id="endTime" class="w-full border rounded p-2 bg-white focus:ring-2 focus:ring-blue-400" placeholder="Chọn ngày giờ...">
            </div>
        </div>
        <button onclick="window.searchAvailableCars()" class="mt-4 w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
            KIỂM TRA XE
        </button>
        <p id="search-msg" class="text-red-500 text-sm mt-2 hidden text-center font-bold">Vui lòng chọn thời gian hợp lệ!</p>
    </div>

    <!-- DANH SÁCH XE -->
    <div class="max-w-6xl mx-auto mt-8 px-4 pb-20">
        <h2 id="list-title" class="text-2xl font-bold text-gray-800 mb-6">Danh sách xe của chúng tôi</h2>
        <div id="car-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- NÚT LIÊN HỆ -->
    <div class="fab-container">
        <a href="https://zalo.me/0877798798" target="_blank" class="fab-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Icon_of_Zalo.svg/1024px-Icon_of_Zalo.svg.png" alt="Zalo"></a>
        <a href="https://m.me/29024354103822524" target="_blank" class="fab-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Facebook_Messenger_logo_2020.svg/1024px-Facebook_Messenger_logo_2020.svg.png" alt="Messenger"></a>
    </div>

    <!-- MÃ LOGIC & KẾT NỐI FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // DÁN FIREBASE CONFIG CỦA BẠN VÀO ĐÂY
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBIVpGGE6zKxKkT6R7SUdgB5TLA9Dtfdlk",
  authDomain: "thuexetulai-fcd79.firebaseapp.com",
  projectId: "thuexetulai-fcd79",
  storageBucket: "thuexetulai-fcd79.firebasestorage.app",
  messagingSenderId: "984655156691",
  appId: "1:984655156691:web:ff57df0de4f5f2ee040b26",
  measurementId: "G-Q4RFFJ76NT"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalBookings = [];
        let dynamicCars = [];
        let isTimeSelected = false;
        let pendingCarSelection = null;

        const flatpickrConfig = { enableTime: true, dateFormat: "Y/m/d H:i", time_24hr: true, minuteIncrement: 30, locale: "vn" };
        flatpickr("#startTime", flatpickrConfig);
        flatpickr("#endTime", flatpickrConfig);

        // LẮNG NGHE DANH SÁCH XE TỪ FIREBASE
        onSnapshot(collection(db, "cars"), (snapshot) => {
            dynamicCars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if(!isTimeSelected) window.renderCars(dynamicCars, false);
            else window.renderCars(dynamicCars, true);
        });

        // LẮNG NGHE ĐƠN HÀNG ĐỂ KIỂM TRA XE BẬN
        onSnapshot(collection(db, "bookings"), (snapshot) => {
            globalBookings = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
            if (isTimeSelected) window.searchAvailableCars();
        });

        function calculateRentalData(startStr, endStr, carPrice = 0) {
            const start = new Date(startStr); 
            const end = new Date(endStr); 
            let totalDays = 0; 
            let surcharge = 0;
            let note = "";

            let currentDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            let endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());

            while (currentDay <= endDay) {
                let b1Start = new Date(currentDay); b1Start.setHours(7, 0, 0, 0); 
                let b1End = new Date(currentDay); b1End.setHours(15, 0, 0, 0); 
                let b2Start = new Date(currentDay); b2Start.setHours(15, 0, 0, 0); 
                let b2End = new Date(currentDay); b2End.setHours(22, 0, 0, 0);
                
                let dayAdded = 0;

                // 1. Ca sáng (07:00 - 15:00)
                if (start < b1End && end > b1Start) {
                    dayAdded += 0.5;
                }

                // 2. Ca chiều (15:00 - 22:00)
                if (start < b2End && end > b2Start) {
                    let ignoreAfternoon = false;
                    // Luật nhận muộn: Nhận xe sau 21h00 ngày đầu tiên sẽ không tính ca chiều
                    if (currentDay.getTime() === new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime()) {
                        if (start.getHours() >= 21) {
                            ignoreAfternoon = true;
                            note = "*Nhận xe muộn: Phụ phí sẽ do chủ xe thông báo riêng (nếu có).";
                        }
                    }
                    if (!ignoreAfternoon) dayAdded += 0.5;
                }

                // 3. Luật trả muộn trong ngày (22:00 đến 00:00)
                if (currentDay.getTime() === endDay.getTime()) {
                    let endTimeInHours = end.getHours() + (end.getMinutes() / 60);
                    if (endTimeInHours > 22 && endTimeInHours < 24) {
                        surcharge += (endTimeInHours - 22) * 100000; // 100k mỗi giờ
                        note = `*Đã cộng phụ phí trả xe muộn sau 22h: ${surcharge.toLocaleString()}đ`;
                    }
                }

                // 4. Luật trả qua ngày (Sau 00:00)
                if (currentDay.getTime() === endDay.getTime() && currentDay > new Date(start.getFullYear(), start.getMonth(), start.getDate())) {
                    let endHour = end.getHours();
                    // Nằm trong khoảng 00:00 đến trước 07:00 sáng
                    if (endHour >= 0 && endHour < 7 && end > new Date(end.getFullYear(), end.getMonth(), end.getDate(), 0, 0, 0)) {
                        dayAdded += 0.5;
                    }
                }

                totalDays += dayAdded;
                currentDay.setDate(currentDay.getDate() + 1);
            }

            // Chốt chặn an toàn: Tối thiểu nửa ngày nếu khung giờ nằm ngoài logic trên
            if (totalDays === 0 && end > start && start.getHours() < 21) {
                totalDays = 0.5; 
            }

            return {
                days: totalDays,
                surcharge: surcharge,
                totalCost: (totalDays * carPrice) + surcharge,
                note: note
            };
        }

        function isCarAvailable(carId, checkStart, checkEnd) {
            const start = new Date(checkStart).getTime(); const end = new Date(checkEnd).getTime();
            for (let b of globalBookings) {
                // ĐÃ THÊM ĐIỀU KIỆN "Đã khóa lịch" VÀO HÀM KIỂM TRA
                if (b.carId === carId && (b.status === 'Đã xác nhận' || b.status === 'Đợi cọc' || b.status === 'Đã khóa lịch')) {
                    const bookedStart = new Date(b.startTime).getTime();
                    const bookedEnd = new Date(b.endTime).getTime();
                    if (start < bookedEnd && end > bookedStart) return false;
                }
            }
            return true;
        }

       // HÀM HIỂN THỊ DANH SÁCH XE VÀ KHO ẢNH DÀNH CHO KHÁCH HÀNG
        window.renderCars = function(carArray, showStatus = false) {
            const list = document.getElementById('car-list'); list.innerHTML = '';
            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;

            carArray.forEach(car => {
                let isAvailable = true;
                let priceHTML = `<p class="text-gray-500 font-medium mt-2">Giá: ${car.price.toLocaleString()} đ / Ngày</p>`;
                let buttonHTML = `<button onclick="window.openModal('${car.id}')" class="mt-4 w-full bg-green-500 text-white font-bold py-2 rounded hover:bg-green-600">CHỌN THUÊ XE NÀY</button>`;
                let cardStyle = "";

                // --- XỬ LÝ HIỂN THỊ KHO ẢNH (MỚI) ---
                let imageGalleryHTML = '';
                // Kiểm tra xem xe này dùng mảng ảnh mới (images) hay link ảnh cũ (image)
                const imageArray = car.images || (car.image ? [car.image] : []);
                
                if (imageArray.length > 0) {
                    const mainImage = imageArray[0]; // Lấy ảnh đầu tiên làm ảnh bìa lớn
                    
                    // Tạo danh sách ảnh nhỏ bên dưới
                    let thumbnails = imageArray.map(img => `
                        <img src="${img}" 
                             class="w-16 h-12 object-cover rounded cursor-pointer hover:opacity-75 border-2 border-transparent hover:border-green-400 flex-shrink-0" 
                             onclick="this.parentElement.previousElementSibling.src='${img}'" 
                             title="Bấm để xem ảnh lớn">
                    `).join('');
                    
                    imageGalleryHTML = `
                        <img src="${mainImage}" class="h-48 w-full object-cover main-img transition-all duration-300" onerror="this.src='https://via.placeholder.com/800x400?text=Loi+Anh'">
                        <div class="flex gap-2 p-2 overflow-x-auto bg-gray-100 shadow-inner">${thumbnails}</div>
                    `;
                } else {
                    imageGalleryHTML = `<img src="https://via.placeholder.com/800x400?text=Chua+Co+Anh" class="h-48 w-full object-cover">`;
                }

                // HTML HIỂN THỊ THÔNG SỐ XE
                const specsHTML = `
                    <div class="flex flex-wrap gap-2 mt-2 text-xs font-semibold text-gray-700">
                        <span class="bg-gray-100 px-2 py-1 rounded border">${car.brand || 'Khác'}</span>
                        <span class="bg-gray-100 px-2 py-1 rounded border">${car.seats || '?'} chỗ</span>
                        <span class="bg-gray-100 px-2 py-1 rounded border">${car.bodyType || 'Xe'}</span>
                        <span class="bg-gray-100 px-2 py-1 rounded border">${car.transmission || '?'}</span>
                        <span class="bg-gray-100 px-2 py-1 rounded border">${car.fuel || '?'}</span>
                    </div>
                `;

                if (showStatus && isTimeSelected) {
                    isAvailable = isCarAvailable(car.id, startStr, endStr);
                    if (isAvailable) {
                        const rentalData = calculateRentalData(startStr, endStr, car.price);
                        const noteHTML = rentalData.note ? `<p class="text-xs text-red-500 mt-2 font-bold">${rentalData.note}</p>` : '';
                        priceHTML = `<div class="mt-2 p-3 bg-blue-50 rounded border border-blue-100">
                                        <p class="text-blue-800 font-bold text-lg">Tổng: ${rentalData.totalCost.toLocaleString()} đ</p>
                                        <p class="text-sm text-blue-600">(Cho ${rentalData.days} ngày thuê)</p>
                                        ${noteHTML}
                                     </div>`;
                    } else {
                        cardStyle = "opacity-75 grayscale";
                        priceHTML = `<div class="mt-2 p-3 bg-red-50 rounded border border-red-200"><p class="text-red-600 font-bold text-lg">Trùng lịch</p><p class="text-sm text-red-500">Đã có khách đặt trong khoảng thời gian này</p></div>`;
                        buttonHTML = `<button disabled class="mt-4 w-full bg-gray-400 text-white font-bold py-2 rounded cursor-not-allowed">ĐÃ ĐƯỢC ĐẶT</button>`;
                    }
                }

                list.innerHTML += `
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col transition hover:shadow-xl ${cardStyle}">
                        <!-- Chèn kho ảnh vào đây -->
                        ${imageGalleryHTML}
                        
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="text-xl font-bold">${car.name}</h3>
                                ${specsHTML}
                                ${priceHTML}
                            </div>
                            ${buttonHTML}
                        </div>
                    </div>`;
            });
        }

        window.searchAvailableCars = function() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const msg = document.getElementById('search-msg');
            const startDate = new Date(start); const endDate = new Date(end);

            if (!start || !end || startDate >= endDate) { msg.classList.remove('hidden'); return; }
            msg.classList.add('hidden'); isTimeSelected = true;
            document.getElementById('list-title').innerText = "Trạng thái các xe trong thời gian bạn chọn";
            window.renderCars(dynamicCars, true);
        }

        window.openModal = function(carId) {
            if (!isTimeSelected) {
                alert("Vui lòng chọn Thời gian nhận và trả xe trước!");
                window.scrollTo({ top: 0, behavior: 'smooth' }); return;
            }
            pendingCarSelection = dynamicCars.find(c => c.id === carId);
            document.getElementById('modal-car-name').innerText = `Xe đã chọn: ${pendingCarSelection.name}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('booking-modal').classList.add('hidden');
            pendingCarSelection = null;
        }

        window.submitBooking = async function() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const delivery = document.getElementById('deliveryAddress').value.trim();
            const returnAdd = document.getElementById('returnAddress').value.trim();

            if(!name || !phone) { alert("Vui lòng điền tối thiểu Tên và Số điện thoại!"); return; }

            document.getElementById('btn-submit').innerText = "Đang xử lý...";
            document.getElementById('btn-submit').disabled = true;

            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;
            const rentalData = calculateRentalData(startStr, endStr, pendingCarSelection.price);
            const totalCost = rentalData.totalCost;
            // Ở bên dưới phần newBooking, anh có thể thêm: note: rentalData.note

            const newBooking = {
                timestamp: Date.now(),
                carId: pendingCarSelection.id, 
                carName: pendingCarSelection.name,
                customerName: name, 
                phone: phone, 
                deliveryAddress: delivery, 
                returnAddress: returnAdd,
                startTime: startStr, 
                endTime: endStr, 
                totalCost: totalCost, 
                status: 'Chờ chủ xe duyệt'
            };

            try {
                await addDoc(collection(db, "bookings"), newBooking);
                
                document.getElementById('customerName').value = ''; document.getElementById('customerPhone').value = '';
                document.getElementById('deliveryAddress').value = ''; document.getElementById('returnAddress').value = '';
                
                window.closeModal();
                alert("Thành công! Chờ chủ xe duyệt và quản lý liên hệ thu cọc.");
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Có lỗi xảy ra, vui lòng thử lại!");
            } finally {
                document.getElementById('btn-submit').innerText = "Xác nhận Đặt";
                document.getElementById('btn-submit').disabled = false;
            }
        }
    </script>
</body>
</html>
