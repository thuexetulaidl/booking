<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-red-800 text-white p-4 shadow-md flex justify-between items-center mb-6">
        <div class="font-bold text-xl">🛡️ Bảng Điều Khiển Quản Trị</div>
        <div class="flex gap-2">
            <a href="chu-xe.html" class="px-4 py-2 bg-green-600 rounded hover:bg-green-500">Chủ Xe</a>
            <a href="index.html" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500">Khách Hàng</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 pb-12">
        <h1 class="text-3xl font-bold text-red-900 mb-6">Trạm Quản Lý Đơn Hàng & Thu Cọc</h1>
        
        <div class="bg-white rounded-lg shadow-lg overflow-x-auto">
            <table class="min-w-full bg-white text-sm">
                <thead class="bg-red-800 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left">Thông tin Khách & Xe</th>
                        <th class="py-3 px-4 text-left">Chi tiết Lịch trình</th>
                        <th class="py-3 px-4 text-left">Tài chính & Thu cọc</th>
                        <th class="py-3 px-4 text-left">Trạng thái</th>
                        <th class="py-3 px-4 text-center">Thao tác Admin</th>
                    </tr>
                </thead>
                <tbody id="manager-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL SỬA LỊCH TRẢ XE -->
    <div id="modal-update-time" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4 text-gray-800">Cập nhật giờ khách trả xe thực tế</h3>
            <input type="text" id="newEndTime" class="w-full border p-2 rounded mb-4" placeholder="Chọn ngày giờ trả xe mới...">
            <div class="flex justify-end gap-2">
                <button onclick="window.closeUpdateModal()" class="bg-gray-400 text-white px-4 py-2 rounded">Hủy</button>
                <button id="btn-save-time" class="bg-yellow-500 text-white px-4 py-2 rounded font-bold">Lưu & Tính lại tiền</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIVpGGE6zKxKkT6R7SUdgB5TLA9Dtfdlk",
            authDomain: "thuexetulai-fcd79.firebaseapp.com",
            projectId: "thuexetulai-fcd79",
            storageBucket: "thuexetulai-fcd79.firebasestorage.app",
            messagingSenderId: "984655156691",
            appId: "1:984655156691:web:ff57df0de4f5f2ee040b26",
            measurementId: "G-Q4RFFJ76NT"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalBookings = []; let globalCars = [];
        let currentEditingId = null;

        flatpickr("#newEndTime", { enableTime: true, dateFormat: "Y/m/d H:i", time_24hr: true, minuteIncrement: 30, locale: "vn" });

        onSnapshot(collection(db, "cars"), (snapshot) => { globalCars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); });
        onSnapshot(collection(db, "bookings"), (snapshot) => {
            globalBookings = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
            globalBookings.sort((a, b) => b.timestamp - a.timestamp);
            window.renderManagerTable();
        });

        function formatDateTime(dateString) { const d = new Date(dateString); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; }

        function calculateRentalData(startStr, endStr) {
            const start = new Date(startStr); const end = new Date(endStr); let totalDays = 0;
            let currentDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            let endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
            while (currentDay <= endDay) {
                let b1Start = new Date(currentDay); b1Start.setHours(7, 0, 0, 0); let b1End = new Date(currentDay); b1End.setHours(15, 0, 0, 0);
                let b2Start = new Date(currentDay); b2Start.setHours(15, 0, 0, 0); let b2End = new Date(currentDay); b2End.setHours(22, 0, 0, 0);
                if (start < b1End && end > b1Start) totalDays += 0.5;
                if (start < b2End && end > b2Start) {
                    let ignore = false; if (currentDay.getTime() === new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime() && start.getHours() >= 21) ignore = true;
                    if (!ignore) totalDays += 0.5;
                }
                if (currentDay.getTime() === endDay.getTime() && currentDay > new Date(start.getFullYear(), start.getMonth(), start.getDate())) {
                    if (end.getHours() >= 0 && end.getHours() < 7 && end > new Date(end.getFullYear(), end.getMonth(), end.getDate(), 0, 0, 0)) totalDays += 0.5;
                }
                currentDay.setDate(currentDay.getDate() + 1);
            }
            if (totalDays === 0 && end > start && start.getHours() < 21) totalDays = 0.5; return { days: totalDays };
        }

        window.renderManagerTable = function() {
            const tbody = document.getElementById('manager-table-body'); tbody.innerHTML = '';
            
            globalBookings.forEach(b => {
                const rentalDays = calculateRentalData(b.startTime, b.endTime).days;
                const delAdd = b.deliveryAddress ? b.deliveryAddress : 'Báo sau'; const retAdd = b.returnAddress ? b.returnAddress : 'Báo sau';
                const routeDisplay = b.route ? `<br><span class="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded inline-block mt-1">🚗 ${b.route}</span>` : '';
                const addressDisplay = b.status !== 'Đã khóa lịch' ? `<br><span class="text-gray-600 text-xs">Giao: ${delAdd}</span><br><span class="text-gray-600 text-xs">Trả: ${retAdd}</span>${routeDisplay}` : '';

                // DỮ LIỆU TÀI CHÍNH
                const depositAmount = b.bookingDeposit || 200000;
                let financeHTML = `<span class="font-bold text-red-500 text-base">${b.totalCost.toLocaleString()}đ</span>`;
                
                if (b.status === 'Đã xác nhận' || b.status === 'Đợi cọc') {
                    financeHTML += `<br><span class="text-xs text-blue-600 font-bold">Mức cọc: ${depositAmount.toLocaleString()}đ</span>`;
                    if (b.status === 'Đã xác nhận') {
                        let remaining = b.totalCost - depositAmount;
                        financeHTML += `<br><span class="text-xs text-red-600 font-bold">Phải thu: ${remaining > 0 ? remaining.toLocaleString() : 0}đ</span>`;
                    }
                }

                // NÚT BẤM LINH HOẠT THEO MỨC CỌC
                let btn = '';
                if (b.status === 'Chờ chủ xe duyệt') btn = '<span class="text-gray-500 text-sm italic">Đợi chủ xe duyệt...</span>';
                else if (b.status === 'Đợi cọc') btn = `<button onclick="window.confirmDeposit('${b.firebaseId}')" class="bg-green-500 text-white px-3 py-2 rounded w-full text-sm font-bold hover:bg-green-600 shadow">Xác nhận thu cọc<br>(${depositAmount.toLocaleString()}đ)</button>`;
                else if (b.status === 'Đã xác nhận') btn = `<button onclick="window.updateEndTime('${b.firebaseId}')" class="bg-yellow-500 text-white px-2 py-1 rounded mb-1 w-full text-sm font-semibold shadow">Khách trả muộn</button><button onclick="window.finishBooking('${b.firebaseId}')" class="bg-gray-600 text-white px-2 py-1 rounded w-full text-sm font-semibold shadow">Chốt đơn / Thu hồi xe</button>`;
                else btn = '<span class="text-gray-400 text-sm">Đã kết thúc</span>';

                const rowClass = b.status === 'Đã khóa lịch' ? 'bg-yellow-50 border-b' : 'border-b hover:bg-gray-50';

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td class="py-2 px-4"><span class="font-bold text-blue-900">${b.carName}</span><br><span class="text-green-600 font-bold">${b.customerName}</span><br><span class="text-gray-600">${b.phone}</span></td>
                        <td class="py-2 px-4"><span class="font-bold text-gray-800">Lấy: ${formatDateTime(b.startTime)}</span><br><span class="font-bold text-red-600">Trả: ${formatDateTime(b.endTime)}</span><br><span class="text-indigo-600 font-bold text-xs">Số ngày: ${rentalDays}</span>${addressDisplay}</td>
                        <td class="py-2 px-4">${financeHTML}</td>
                        <td class="py-2 px-4"><span class="bg-gray-100 border px-2 py-1 text-xs font-semibold rounded shadow-sm">${b.status}</span></td>
                        <td class="py-2 px-4 text-center">${btn}</td>
                    </tr>`;
            });
        }

        window.confirmDeposit = async function(firebaseId) {
            if(confirm("Xác nhận đã nhận đủ tiền cọc giữ chỗ từ khách hàng?")) {
                await updateDoc(doc(db, "bookings", firebaseId), { status: 'Đã xác nhận' });
            }
        }

        window.finishBooking = async function(firebaseId) {
            if(confirm("Xe đã được trả về bãi an toàn và kết thúc hợp đồng?")) {
                await updateDoc(doc(db, "bookings", firebaseId), { status: 'Đã thu hồi' });
            }
        }

        window.updateEndTime = function(firebaseId) {
            currentEditingId = firebaseId; document.getElementById('modal-update-time').classList.remove('hidden');
        }
        window.closeUpdateModal = function() { document.getElementById('modal-update-time').classList.add('hidden'); currentEditingId = null; }

        document.getElementById('btn-save-time').addEventListener('click', async () => {
            const newTime = document.getElementById('newEndTime').value;
            if(!newTime) { alert("Chọn giờ trả xe!"); return; }
            const b = globalBookings.find(doc => doc.firebaseId === currentEditingId);
            
            let isFar = false; if (b.route && b.route.includes("Đi xa")) isFar = true;
            
            // Tính lại tiền
            const carPrice = globalCars.find(c => c.id === b.carId).price;
            
            // Giả lập logic tính nhanh (anh có thể copy hàm tính chi tiết từ index.html nếu cần tuyệt đối chính xác)
            const rentalDays = calculateRentalData(b.startTime, newTime).days;
            let newTotalCost = rentalDays * carPrice;
            if(isFar) newTotalCost += (rentalDays * 200000);

            try {
                await updateDoc(doc(db, "bookings", currentEditingId), { endTime: newTime, totalCost: newTotalCost });
                alert("Đã cập nhật lại giờ trả xe và tính lại tiền!"); window.closeUpdateModal();
            } catch(e) { console.error(e); }
        });
    </script>
</body>
</html>
